<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>链接下载器</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(_){}</script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">↓</span>
        <div><h1 data-i18n="appName">链接下载器</h1></div>
      </div>
      <div class="top-actions">
        <button id="languageBtn" class="utility-btn" type="button" title="Switch to English">EN</button>
        <button id="themeBtn" class="utility-btn theme-btn" type="button" title="切换深色主题" aria-label="切换深色主题"><span id="themeIcon">☾</span></button>
        <button id="settingsBtn" class="ghost" type="button" data-i18n="settings">设置</button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">MEDIA LINK DOWNLOADER</span>
        <h2 data-i18n="heroTitle">把链接变成文件</h2>
        <p data-i18n="heroDescription">支持主流视频平台，一次粘贴，统一管理。</p>
        <div class="platforms" aria-label="Supported platforms">
          <div class="platform-chip youtube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="#ff0033"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg><span>YouTube</span></div>
          <div class="platform-chip tiktok"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="note-shadow-cyan" d="M14 3v11.2a3.4 3.4 0 1 1-2.4-3.25V7h2.1c1.1 1.8 2.5 2.8 4.3 3V7c-1.8-.45-2.8-1.8-3.2-4z"/><path class="note-shadow-red" d="M15 3v11.2a3.4 3.4 0 1 1-2.4-3.25V7h2.1c1.1 1.8 2.5 2.8 4.3 3V7c-1.8-.45-2.8-1.8-3.2-4z"/><path class="note-main" d="M14.5 3v11.2a3.4 3.4 0 1 1-2.4-3.25V7h2.1c1.1 1.8 2.5 2.8 4.3 3V7c-1.8-.45-2.8-1.8-3.2-4z"/></svg><span>TikTok</span></div>
          <div class="platform-chip instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffb900"/><stop offset=".5" stop-color="#ef2b7b"/><stop offset="1" stop-color="#7147d9"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5" fill="url(#ig)"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="17.5" cy="6.8" r="1.2" fill="#fff"/></svg><span>Instagram</span></div>
          <div class="platform-chip douyin"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="note-shadow-cyan" d="M14 3v11.2a3.4 3.4 0 1 1-2.4-3.25V7h2.1c1.1 1.8 2.5 2.8 4.3 3V7c-1.8-.45-2.8-1.8-3.2-4z"/><path class="note-shadow-red" d="M15 3v11.2a3.4 3.4 0 1 1-2.4-3.25V7h2.1c1.1 1.8 2.5 2.8 4.3 3V7c-1.8-.45-2.8-1.8-3.2-4z"/><path class="note-main" d="M14.5 3v11.2a3.4 3.4 0 1 1-2.4-3.25V7h2.1c1.1 1.8 2.5 2.8 4.3 3V7c-1.8-.45-2.8-1.8-3.2-4z"/></svg><span data-i18n="douyin">抖音</span></div>
          <div class="platform-chip bilibili"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l2 2M16 4l-2 2" stroke="#00aeec" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="6" width="18" height="14" rx="3" fill="#00aeec"/><rect x="6" y="9" width="12" height="7" rx="1.5" fill="#fff"/><path d="M9 11.5v2M15 11.5v2" stroke="#00aeec" stroke-width="1.5" stroke-linecap="round"/></svg><span>Bilibili</span></div>
        </div>
      </div>
      <div class="hero-orb">✦</div>
    </section>

    <section class="card input-card">
      <label for="urlInput" data-i18n="mediaLink">媒体链接</label>
      <div class="input-row"><textarea id="urlInput" rows="3" data-i18n-placeholder="inputPlaceholder" placeholder="粘贴一个链接或平台分享文案"></textarea><button id="inspectBtn" class="primary" type="button"><span data-i18n="inspect">解析链接</span> <span>→</span></button></div>
    </section>

    <div class="content-grid">
      <section class="card details">
        <div class="section-title"><h3 data-i18n="contentInfo">内容信息</h3><span id="platformBadge" class="badge muted" data-i18n="waiting">等待解析</span></div>
        <div id="emptyState" class="empty"><div class="empty-icon">◌</div><p data-i18n="emptyHint">解析后将在这里显示标题、作者和可用格式</p></div>
        <div id="mediaInfo" class="media-info hidden"><img id="thumbnail" data-i18n-alt="cover" alt="封面"><div><h3 id="mediaTitle"></h3><p id="mediaAuthor"></p><p id="mediaDescription" class="description"></p></div></div>
        <div id="formatArea" class="format-area hidden"><label for="formatSelect" data-i18n="downloadQuality">下载质量</label><select id="formatSelect"><option value="bv*+ba/b" data-i18n="bestQuality">最佳可用质量</option></select><label class="check"><input id="metadataCheck" type="checkbox" checked> <span data-i18n="saveMetadata">同时保存封面、文案和元数据</span></label><button id="downloadBtn" class="primary full" type="button" data-i18n="addQueue">加入下载队列</button></div>
      </section>
      <section class="card queue"><div class="section-title"><h3 data-i18n="downloadQueue">下载队列</h3><span id="queueCount" class="count">0</span></div><div id="queueList" class="queue-list"><div class="empty small"><div class="empty-icon">▤</div><p data-i18n="noTasks">还没有下载任务</p></div></div></section>
    </div>

    <footer><button id="folderBtn" class="link" type="button" data-i18n="chooseFolder">选择保存位置</button><span id="outputPath">未选择，使用默认目录</span></footer>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
